name: Catalog competition cron

on:
  schedule:
    # UTC. ~every 10 min at off-peak minutes (avoids :00/:15/:30/:45 GitHub queue spikes).
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger catalog competition poll
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET repository secrets."
            exit 1
          fi
          curl -fsS -X POST "${APP_URL%/}/api/cron/catalog-competition" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
